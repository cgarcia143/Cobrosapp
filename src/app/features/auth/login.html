<section class="mx-auto flex w-full max-w-md flex-1 items-center px-4 py-10">
  <form class="panel w-full" [formGroup]="form" (ngSubmit)="submit()">
    <p class="kicker">Cobranzas</p>
    <h1 class="title mt-2">Ingresar</h1>

    @if (!configured) {
      <p class="note note-warn mt-4">
        Falta la configuración de Firebase en <code>src/environments/environment.ts</code>.
      </p>
    }
    @if (errorMessage()) {
      <p class="note note-error mt-4">{{ errorMessage() }}</p>
    }

    <label class="field mt-6">
      <span>Correo</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label class="field mt-4">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <button class="btn btn-primary mt-6 w-full" type="submit" [disabled]="saving()">
      {{ saving() ? 'Ingresando…' : 'Entrar' }}
    </button>
  </form>
</section>
